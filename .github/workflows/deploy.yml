name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  prepare:
    # Aceita apenas artefatos do CI de push na main deste repositório.
    # Nenhum código de PR é executado neste workflow com permissões de publicação.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Download validated main build
        uses: actions/download-artifact@v4
        with:
          name: portfolio-production
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Name Pages artifact for this attempt
        id: artifact
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.prepare.outputs.artifact_name }}
